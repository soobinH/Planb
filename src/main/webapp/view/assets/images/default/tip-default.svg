<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <!-- 여행꿀팁 기본 이미지 : 전구 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF0FF"/>
      <stop offset="1" stop-color="#F7F3FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE58A" stop-opacity=".75"/>
      <stop offset="1" stop-color="#FFE58A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE27A"/>
      <stop offset="1" stop-color="#FFC93C"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- 배경 장식 -->
  <circle cx="170" cy="160" r="110" fill="#E2E4FB"/>
  <circle cx="1060" cy="650" r="160" fill="#E4E5FB"/>
  <circle cx="1010" cy="170" r="18" fill="#D1D2F9"/>
  <circle cx="230" cy="620" r="12" fill="#D1D2F9"/>
  <circle cx="300" cy="300" r="7" fill="#C3C5F4"/>
  <circle cx="900" cy="520" r="9" fill="#C3C5F4"/>

  <!-- 빛 -->
  <circle cx="600" cy="360" r="260" fill="url(#glow)"/>
  <g stroke="#FFD447" stroke-width="16" stroke-linecap="round">
    <line x1="600" y1="150" x2="600" y2="100"/>
    <line x1="455" y1="210" x2="420" y2="175"/>
    <line x1="745" y1="210" x2="780" y2="175"/>
    <line x1="395" y1="355" x2="345" y2="355"/>
    <line x1="805" y1="355" x2="855" y2="355"/>
    <line x1="440" y1="480" x2="405" y2="510"/>
    <line x1="760" y1="480" x2="795" y2="510"/>
  </g>

  <!-- 전구 유리 -->
  <path d="M540 478 C540 432 470 412 470 345 A130 130 0 1 1 730 345 C730 412 660 432 660 478 Z" fill="url(#glass)"/>
  <path d="M520 300 A85 85 0 0 1 590 240" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" opacity=".75"/>

  <!-- 필라멘트 -->
  <path d="M568 478 L575 405 Q586 380 600 405 Q614 380 625 405 L632 478" fill="none" stroke="#E0A400" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 소켓 -->
  <rect x="540" y="482" width="120" height="26" rx="10" fill="#6369D1"/>
  <rect x="548" y="514" width="104" height="24" rx="10" fill="#6369D1"/>
  <rect x="572" y="544" width="56" height="22" rx="11" fill="#4B51B8"/>

  <!-- 바닥 그림자 -->
  <ellipse cx="600" cy="640" rx="150" ry="16" fill="#D9DAF8"/>
</svg>
